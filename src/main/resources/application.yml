spring:
  application:
    name: customsisdevapi
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: ${DB_USERNAME:SEU_USUARIO}
    password: ${DB_PASSWORD:SUA_SENHA}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

integracao:
  externa:
    base-url: ${EXTERNAL_BASE_URL:http://localhost:9090}
    connect-timeout: 3s
    read-timeout: 5s

logging:
  level:
    root: INFO
    com.example.customsisdevapi: INFO
